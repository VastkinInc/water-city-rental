<body class="bg-background text-on-background font-body min-h-screen flex flex-col md:flex-row antialiased">

<div class="w-full md:w-1/2 lg:w-5/12 xl:w-1/3 flex flex-col justify-center px-8 py-12 md:px-16 lg:px-24 bg-surface z-10 relative">

<div class="absolute top-12 left-8 md:left-16 lg:left-24">
<a href="/"><h1 class="font-display italic text-2xl text-on-surface font-bold">Water City Rental</h1></a>
</div>
<div class="max-w-md w-full mx-auto mt-16 md:mt-0">
<!-- Step 1: Role Selection (Active View) -->
<div class="flex flex-col gap-8" id="step-1">
<div>
<h2 class="font-headline text-4xl text-on-surface mb-3">Welcome <span class="italic">Back</span>, Partner</h2>
<p class="text-on-surface-variant font-body text-lg">Select your role to continue</p>
</div>
<!-- Role Cards -->
<div class="grid grid-cols-2 gap-4">
<!-- Boat Owner Card -->
<button class="role-card flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-2xl border border-outline-variant/15 shadow-[0_8px_32px_rgba(26,28,26,0.04)] hover:shadow-[0_12px_48px_rgba(26,28,26,0.06)] transition-all duration-300 group focus:outline-none focus:ring-2 focus:ring-tertiary" data-role="owner" onclick="selectRole('owner')">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary">sailing</span>
</div>
<span class="font-headline text-lg font-medium text-on-surface">Boat Owner</span>
</button>
<!-- Captain Card -->
<button class="role-card flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-2xl border border-outline-variant/15 shadow-[0_8px_32px_rgba(26,28,26,0.04)] hover:shadow-[0_12px_48px_rgba(26,28,26,0.06)] transition-all duration-300 group focus:outline-none focus:ring-2 focus:ring-tertiary" data-role="captain" onclick="selectRole('captain')">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary">anchor</span>
</div>
<span class="font-headline text-lg font-medium text-on-surface">Captain</span>
</button>
</div>
<!-- Action -->
<button class="w-full py-4 px-6 mt-4 bg-gradient-to-r from-primary to-primary-container text-on-primary-container font-body font-bold rounded-full flex items-center justify-center gap-2 hover:opacity-90 transition-opacity shadow-[0_4px_20px_rgba(255,127,80,0.2)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="continue-btn" onclick="goToStep2()">
                    Continue
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<!-- Footer Link -->
<div class="text-center mt-6">
<a class="text-on-surface-variant font-body hover:text-primary transition-colors flex items-center justify-center gap-1 group" href="/partner">
                        Not a partner yet? Join free
                        <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</a>
</div>
</div>
<!-- Step 2: Login Form -->
<div class="hidden flex-col gap-8" id="step-2">
<div>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1 mb-4 font-body text-sm" onclick="goToStep1()">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                        Change role
                    </button>
<div class="inline-flex items-center gap-2 bg-primary-fixed text-on-primary-fixed px-3 py-1 rounded-full mb-4">
<span class="material-symbols-outlined text-sm" id="role-badge-icon">sailing</span>
<span class="font-label text-xs uppercase tracking-widest font-bold" id="role-badge-text">Boat Owner</span>
</div>
<h2 class="font-headline text-4xl text-on-surface mb-3">Welcome <span class="italic">back</span>.</h2>
<p class="text-on-surface-variant font-body text-lg">Sign in to manage your <span id="role-context">fleet</span>.</p>
</div>
<form class="flex flex-col gap-5" onsubmit="event.preventDefault(); signIn();">
<div>
<label class="block font-label text-sm uppercase tracking-widest text-on-surface-variant mb-2" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border-0 px-4 py-4 rounded-xl text-on-surface focus:ring-2 focus:ring-tertiary shadow-[0_2px_12px_rgba(26,28,26,0.03)]" id="email" placeholder="partner@example.com" type="email"/>
</div>
<div>
<div class="flex justify-between items-baseline mb-2">
<label class="block font-label text-sm uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="font-label text-xs text-primary hover:underline" href="#">Forgot?</a>
</div>
<input class="w-full bg-surface-container-lowest border-0 px-4 py-4 rounded-xl text-on-surface focus:ring-2 focus:ring-tertiary shadow-[0_2px_12px_rgba(26,28,26,0.03)]" id="password" placeholder="••••••••" type="password"/>
</div>
<p id="signin-error" style="display:none;color:#ba1a1a;font-size:13px;text-align:center;margin:0"></p>
<button id="signin-button" class="w-full py-4 px-6 mt-4 bg-gradient-to-r from-primary to-primary-container text-on-primary-container font-body font-bold rounded-full hover:opacity-90 transition-opacity shadow-[0_4px_20px_rgba(255,127,80,0.2)]" onclick="signIn()" type="button">
                        Sign In

</form>

</div>
</div>
<!-- Right Side: Visual Area -->
<div class="hidden md:flex md:w-1/2 lg:w-7/12 xl:w-2/3 relative bg-surface-container-high overflow-hidden">

<div class="absolute inset-0 bg-cover bg-center" data-alt="A breathtaking, high-quality photograph of a sleek, modern luxury yacht docked in a bustling harbor during the 'Golden Hour' sunset. The warm, coral-orange sunlight violently reflects off the deep navy water, creating a stunning contrast. The lighting is dramatic and moody, emphasizing the premium, high-end lifestyle aesthetic associated with elite nautical travel. The overall color palette perfectly blends the warm setting sun with the cool, deep tones of the ocean." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD2P4sfdHXahYJPVjOpdN7f54daZ7qf81bkpmGfi0eRreLifHsjDS9EKNIdCxSdvod9iFUKrxMRuBcgm804qM0T3WY_fyXLoUOGgJ7yX-aGIcdrHZCyNLi58WMAMifVg-tSXv-OFnKPc3-FqCAbbq_EZAM5K731wnMX3v1-KcFKFQgCF0yT-VKmW9i06zKil5HN1FPw5oPwDZMHvbg-O8jEyFagCD8J8l-JD-u9E3uFLxJoeanEfuu1nX6bzVkntOWBHrpr4POas4PB');">
</div>
<!-- Gradient Overlay for better readability -->
<div class="absolute inset-0 bg-gradient-to-t from-background/80 via-transparent to-transparent"></div>
<!-- Glassmorphism Floating Card -->
<div class="relative z-10 m-auto max-w-sm w-full p-8 glass-panel rounded-3xl border border-surface-container-lowest/20 shadow-[0_32px_64px_rgba(26,28,26,0.08)]">
<div class="flex flex-col items-center text-center">
<h3 class="font-display italic text-xl text-on-surface mb-8 font-bold opacity-90">Water City Rental</h3>
<div class="mb-8">
<div class="font-headline text-5xl text-primary font-bold mb-2 tracking-tight">$42,000</div>
<div class="font-label text-xs uppercase tracking-widest text-on-surface-variant">Top partner earnings this year</div>
</div>
<div class="w-full h-px bg-outline-variant/30 my-4 hidden"></div>
<div class="flex items-center justify-center gap-2 bg-surface-container-lowest/80 px-4 py-2 rounded-full mt-4">
<span class="material-symbols-outlined text-secondary text-lg fill">star</span>
<span class="font-body font-bold text-on-surface">4.9</span>
<span class="font-label text-xs uppercase tracking-widest text-on-surface-variant ml-1">Average rating</span>
</div>
</div>
</div>
</div>
<script>
var selectedRole = null;

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-card').forEach(function(c){
    c.classList.remove('selected');
  });
  document.querySelector('.role-card[data-role="'+role+'"]').classList.add('selected');
  document.getElementById('continue-btn').disabled = false;
}

function goToStep2() {
  if (!selectedRole) return;
  document.getElementById('step-1').classList.add('hidden');
  document.getElementById('step-1').classList.remove('flex');
  document.getElementById('step-2').classList.remove('hidden');
  document.getElementById('step-2').classList.add('flex');
  if (selectedRole === 'owner') {
    document.getElementById('role-badge-icon').textContent = 'sailing';
    document.getElementById('role-badge-text').textContent = 'Boat Owner';
    document.getElementById('role-context').textContent = 'fleet';
  } else {
    document.getElementById('role-badge-icon').textContent = 'anchor';
    document.getElementById('role-badge-text').textContent = 'Captain';
    document.getElementById('role-context').textContent = 'trips';
  }
}

function goToStep1() {
  document.getElementById('step-2').classList.add('hidden');
  document.getElementById('step-2').classList.remove('flex');
  document.getElementById('step-1').classList.remove('hidden');
  document.getElementById('step-1').classList.add('flex');
}

function showSigninErr(msg){
  var el = document.getElementById('signin-error');
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function signIn() {
  showSigninErr('');
  if (!selectedRole) {
    showSigninErr('Please pick a role first.');
    return;
  }
  var email = (document.getElementById('email').value || '').trim();
  var password = document.getElementById('password').value || '';
  if (!email || !password) {
    showSigninErr('Email and password are required.');
    return;
  }
  var btn = document.getElementById('signin-button');
  var origLabel = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = 'Signing in…'; btn.style.opacity = '0.7'; }
  try {
    var res = await WCR.login(email, password);
    var role = res.user && res.user.role;
    if (role !== selectedRole) {
      showSigninErr("This account isn't a " + selectedRole + " account.");
      WCR.clearToken();
      return;
    }
    window.parent.location.href = '/dashboard/' + role;
  } catch (err) {
    if (err && err.status === 401) {
      showSigninErr('Invalid email or password');
    } else {
      showSigninErr('Something went wrong. Try again.');
    }
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = origLabel; btn.style.opacity = '1'; }
  }
}

// Auto-redirect if already logged in as a partner
(function(){
  if (window.WCR && WCR.isLoggedIn()) {
    var u = WCR.getUser();
    if (u && (u.role === 'owner' || u.role === 'captain')) {
      window.parent.location.href = '/dashboard/' + u.role;
    }
  }
})();
</script>
<script>
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href]');
  if(!a)return;
  var h=a.getAttribute('href');
  if(!h||h.startsWith('http')||h==='#')return;
  e.preventDefault();
  window.parent.location.href=h;
});
</script>
</body></html>
