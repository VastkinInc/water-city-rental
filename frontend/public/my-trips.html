<button data-filter="pending" class="text-on-surface-variant hover:text-on-surface font-medium text-sm uppercase tracking-widest pb-2 relative group whitespace-nowrap transition-colors">
                    New

                    Upcoming

</button>

<script>
(function(){
  if (!WCR.isLoggedIn()) { window.parent.location.href = '/login'; return; }
  var user = WCR.getUser() || {};
  if (user.role !== 'captain' && user.role !== 'admin') {
    window.parent.location.href = '/login';
    return;
  }

  var allTrips = [];
  var currentFilter = 'all';

  function escapeHtml(s){
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtDate(str){
    if (!str) return '';
    var d = new Date(str);
    return isNaN(d) ? '' : d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }
  function isOngoing(b){
    if (b.status !== 'confirmed') return false;
    var now = new Date(); now.setHours(0,0,0,0);
    var start = new Date(b.startDate); start.setHours(0,0,0,0);
    var end = new Date(b.endDate); end.setHours(23,59,59,999);
    return now >= start && now <= end;
  }
  function statusBadge(b){
    // For confirmed trips that are happening today, override the label with "ONGOING".
    if (b.status === 'confirmed' && isOngoing(b)) {
      return '<span style="background:#D1FAE5;color:#065F46;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.05em;white-space:nowrap;">ONGOING</span>';
    }
    var c = WCR.computeStatus(b);
    return '<span style="background:'+c.bg+';color:'+c.fg+';padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.05em;white-space:nowrap;">'+c.label+'</span>';
  }

  function renderTripCard(b){
    var bookingId = b._id || b.id;
    var photo = b.boat && b.boat.photos && b.boat.photos[0] ? b.boat.photos[0].url : '';
    var boatName = b.boat ? b.boat.name : '';
    var harbor = b.boat ? b.boat.harbor : '';
    var customerName = b.customer ? b.customer.name : '';
    var dates = fmtDate(b.startDate) + ' → ' + fmtDate(b.endDate);
    var payout = b.pricing && b.pricing.captainTotal ? b.pricing.captainTotal.toLocaleString() : '0';

    var actions = '';
    if (b.status === 'pending' && !b.captainApproved) {
      actions = ''
        + '<button onclick="captainAcceptTrip(\'' + bookingId + '\')" style="padding:8px 16px;background:#065F46;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Accept Trip</button>'
        + '<button onclick="captainDeclineTrip(\'' + bookingId + '\')" style="padding:8px 16px;background:transparent;color:#991B1B;border:1px solid #FCA5A5;border-radius:8px;font-weight:600;cursor:pointer;margin-left:8px;">Decline</button>';
    } else if (b.status === 'confirmed' && isOngoing(b)) {
      actions = '<button onclick="captainComplete(\'' + bookingId + '\')" style="padding:8px 16px;background:#065F46;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Mark Complete</button>';
    } else {
      actions = '<button onclick="window.parent.location.href=\'/booking/' + bookingId + '\'" style="padding:8px 16px;background:transparent;border:1px solid #1A1A2E;border-radius:8px;color:#1A1A2E;font-weight:600;cursor:pointer;">View Details</button>';
    }

    return ''
      + '<div style="display:flex;gap:20px;padding:20px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);margin-bottom:16px;">'
      +   '<div style="width:140px;height:140px;background-image:url(' + escapeHtml(photo) + ');background-size:cover;background-position:center;background-color:#F5F0EA;border-radius:10px;flex-shrink:0;"></div>'
      +   '<div style="flex:1;">'
      +     '<div style="display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:6px;">'
      +       '<h3 style="font-family:\'Playfair Display\',serif;font-size:20px;color:#1A1A2E;margin:0;">' + escapeHtml(boatName) + '</h3>'
      +       statusBadge(b)
      +     '</div>'
      +     '<p style="margin:0 0 4px;color:#1A1A2E;font-size:14px;">📍 ' + escapeHtml(harbor) + '</p>'
      +     '<p style="margin:0 0 4px;color:#1A1A2E;font-size:14px;">👤 ' + escapeHtml(customerName) + '</p>'
      +     '<p style="margin:0 0 12px;color:#1A1A2E;font-size:14px;">📅 ' + dates + '</p>'
      +     '<div style="display:flex;justify-content:space-between;align-items:center;">'
      +       '<span style="font-size:16px;font-weight:600;color:#C4623A;">$' + payout + ' payout</span>'
      +       '<div>' + actions + '</div>'
      +     '</div>'
      +   '</div>'
      + '</div>';
  }

  window.captainComplete = async function(bookingId){
    if (!confirm('Mark this trip as complete? This finalizes the booking.')) return;
    try {
      await WCR._call('PATCH', '/bookings/' + bookingId + '/complete', null);
      await loadTrips();
    } catch (err) {
      alert('Could not mark complete: ' + (err.message || 'Error'));
    }
  };
  window.captainAcceptTrip = async function(id){
    if (!confirm('Accept this trip?')) return;
    try {
      await WCR._call('PATCH', '/bookings/' + id + '/captain-accept', null);
      await loadTrips();
    } catch (err) {
      alert('Could not accept: ' + (err.message || 'Error'));
    }
  };
  window.captainDeclineTrip = async function(id){
    if (!confirm('Decline this trip? The owner will be asked to assign a new captain.')) return;
    try {
      await WCR._call('PATCH', '/bookings/' + id + '/captain-decline', null);
      await loadTrips();
    } catch (err) {
      alert('Could not decline: ' + (err.message || 'Error'));
    }
  };

  function applyFilter(){
    var listEl = document.getElementById('trips-list');
    if (!listEl) return;
    var filtered;
    // "New" tab (data-filter=pending) = trips awaiting THIS captain's acceptance.
    if      (currentFilter === 'all')        filtered = allTrips;
    else if (currentFilter === 'pending')    filtered = allTrips.filter(function(b){ return b.status === 'pending' && !b.captainApproved; });
    else if (currentFilter === 'confirmed')  filtered = allTrips.filter(function(b){ return b.status === 'confirmed' && !isOngoing(b); });
    else if (currentFilter === 'ongoing')    filtered = allTrips.filter(isOngoing);
    else if (currentFilter === 'completed')  filtered = allTrips.filter(function(b){ return b.status === 'completed'; });
    else                                     filtered = allTrips;

    if (filtered.length === 0) {
      listEl.innerHTML = '<div style="padding:48px;text-align:center;color:#6B6560;">No trips in this category.</div>';
    } else {
      filtered.sort(function(a,b){ return new Date(b.startDate) - new Date(a.startDate); });
      listEl.innerHTML = filtered.map(renderTripCard).join('');
    }
  }

  async function loadTrips(){
    var listEl = document.getElementById('trips-list');
    if (listEl) listEl.innerHTML = '<div style="padding:32px;text-align:center;color:#6B6560;">Loading trips…</div>';
    try {
      var resp = await WCR.myBookings();
      allTrips = resp.data || resp.bookings || resp || [];
      applyFilter();
    } catch (err) {
      if (err.status === 401) { window.parent.location.href = '/login'; return; }
      if (listEl) listEl.innerHTML = '<div style="padding:32px;text-align:center;color:#C4623A;">Could not load trips.</div>';
    }
  }

  function init(){
    var tabs = document.querySelectorAll('[data-filter]');
    tabs.forEach(function(tab){
      tab.addEventListener('click', function(e){
        e.preventDefault();
        tabs.forEach(function(t){
          t.classList.remove('text-on-surface','font-bold');
          t.classList.add('text-on-surface-variant','font-medium');
        });
        tab.classList.remove('text-on-surface-variant','font-medium');
        tab.classList.add('text-on-surface','font-bold');
        currentFilter = tab.getAttribute('data-filter');
        applyFilter();
      });
    });
    loadTrips();
  }

  if (document.readyState !== 'loading') init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>
<script>
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href]');
  if(!a)return;
  var h=a.getAttribute('href');
  if(!h||h.startsWith('http')||h==='#')return;
  e.preventDefault();
  window.parent.location.href=h;
});
</script>
